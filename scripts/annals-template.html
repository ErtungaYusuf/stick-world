<title>Stick World Annals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a carved-stone register — one world at a time, its curve of people across the centuries, then the annals cut year by year, then the lives. */
:root {
  --stone: #e4e6e1;        /* weathered limestone */
  --slab: #f1f2ee;         /* a smoother face for panels */
  --ink: #23262a;          /* soot ink */
  --ink-soft: #5b6066;
  --rule: #c5c9c2;
  --ochre: #a8551f;        /* iron-oxide red, the carver's colour */
  --lapis: #2f5d8a;        /* winter, water */
  --moss: #4f7a3a;         /* growth, inventions */
  --blood: #a3262a;        /* violence, revolt */
  --gold: #9a7a1c;         /* rule, faith */
  --f-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --stone: #1b1d1f; --slab: #24272a; --ink: #e3e4df; --ink-soft: #a3a8a2; --rule: #3a3e41;
  --ochre: #d98a4e; --lapis: #7aa7d6; --moss: #8cbf6f; --blood: #e0686a; --gold: #d4b44f; color-scheme: dark } }
:root[data-theme="dark"] {
  --stone: #1b1d1f; --slab: #24272a; --ink: #e3e4df; --ink-soft: #a3a8a2; --rule: #3a3e41;
  --ochre: #d98a4e; --lapis: #7aa7d6; --moss: #8cbf6f; --blood: #e0686a; --gold: #d4b44f; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--stone); color: var(--ink); font: 16px/1.55 var(--f-body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 34px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: clamp(34px, 6vw, 56px); line-height: 1.02; }
h2 { font-size: 26px; }
h3 { font-size: 19px; }
.lede { max-width: 64ch; color: var(--ink-soft); margin: 10px 0 0; }
.label { font: 500 11px/1 var(--f-data); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }

header { display: grid; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
.status { font: 13px var(--f-data); color: var(--ink-soft); }

/* world picker */
.worlds { display: flex; flex-wrap: wrap; gap: 8px; }
.worlds button { font: inherit; cursor: pointer; border: 1px solid var(--rule); background: var(--slab); color: var(--ink); border-radius: 3px; padding: 8px 12px; display: grid; gap: 2px; text-align: left; min-width: 132px; }
.worlds button:hover { border-color: var(--ink-soft); }
.worlds button:focus-visible, .chips button:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
.worlds button[aria-pressed="true"] { border-color: var(--ochre); box-shadow: inset 0 -3px 0 var(--ochre); }
.worlds .wname { font-family: var(--f-display); font-size: 17px; }
.worlds .wsub { font: 12px var(--f-data); color: var(--ink-soft); }
.worlds svg { width: 100%; height: 26px; display: block; }

/* the world */
.world { display: grid; gap: 18px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.fact { background: var(--slab); padding: 10px 12px; display: grid; gap: 4px; }
.fact b { font: 500 22px/1 var(--f-data); font-variant-numeric: tabular-nums; }
.chart { background: var(--slab); border: 1px solid var(--rule); padding: 12px 12px 6px; overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 560px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font: 12px var(--f-data); color: var(--ink-soft); padding: 6px 4px 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }

/* annals */
.cols { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.chips button { font: 12px var(--f-data); cursor: pointer; border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 10px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--stone); border-color: var(--ink); }
.annals { display: grid; gap: 18px; max-height: 1100px; overflow-y: auto; padding-right: 6px; }
.century { display: grid; gap: 6px; }
.century h3 { position: sticky; top: 0; background: var(--stone); padding: 4px 0; border-bottom: 1px solid var(--rule); }
.ev { display: grid; grid-template-columns: 58px 1fr; gap: 10px; font-size: 15px; }
.ev .y { font: 12px/1.9 var(--f-data); color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
.ev .t { border-left: 3px solid var(--rule); padding-left: 10px; min-width: 0; }
.k-revolt .t, .k-war .t, .k-killing .t { border-color: var(--blood); }
.k-winter .t { border-color: var(--lapis); }
.k-invention .t, .k-discovery .t, .k-culture .t, .k-farming .t, .k-herding .t { border-color: var(--moss); }
.k-leader .t, .k-religion .t, .k-purpose .t { border-color: var(--gold); }
.k-arrival .t, .k-settle .t, .k-band .t { border-color: var(--ochre); }
.empty { color: var(--ink-soft); font-style: italic; }

/* lives */
.lives { display: grid; gap: 14px; }
.life { background: var(--slab); border: 1px solid var(--rule); padding: 12px 14px; display: grid; gap: 6px; }
.life header { border: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.life .meta { font: 12px var(--f-data); color: var(--ink-soft); }
.life ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14.5px; }
.life li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; }
.life li span:first-child { font: 12px/1.8 var(--f-data); color: var(--ink-soft); text-align: right; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 11px var(--f-data); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; color: var(--ink-soft); }

footer { color: var(--ink-soft); font-size: 13px; border-top: 1px solid var(--rule); padding-top: 14px; max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .ev, .life { animation: rise .35s ease both; } @keyframes rise { from { opacity: .4; transform: translateY(3px); } to { opacity: 1; transform: none; } } }
</style>

<div class="wrap">
  <header>
    <span class="label">Stick World · the long runs</span>
    <h1 id="h1">Annals of the Worlds</h1>
    <p class="lede" id="lede"></p>
    <span class="status" id="status"></span>
  </header>

  <section aria-labelledby="pick">
    <h2 id="pick" class="label" style="font-family:var(--f-data);font-size:11px">Choose a world</h2>
    <div class="worlds" id="worlds" style="margin-top:10px"></div>
  </section>

  <section class="world" id="world" aria-live="polite"></section>

  <section class="cols">
    <div>
      <h2>The Annals</h2>
      <div class="chips" id="chips"></div>
      <div class="annals" id="annals"></div>
    </div>
    <div>
      <h2>Lives Remembered</h2>
      <p class="lede" style="margin:6px 0 14px">People whose stories ran long: orphans, avengers, rulers, rebels. Every line was written by the simulation as it happened.</p>
      <div class="lives" id="lives"></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*DATA*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n >= 10000 ? (n / 1000).toFixed(0) + 'k' : n.toLocaleString('en');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const W = DATA.worlds.slice().sort((a, b) => b.years - a.years || a.seed - b.seed);
const names = ['Ashfall', 'Riverholm', 'Greywater', 'Hollow Pines', 'Saltmarsh', 'Emberreach', 'Coldstone', 'Thornvale'];
W.forEach((w, i) => { w.name = names[i % names.length]; });

const minYears = Math.min(...W.map(w => w.years)), maxYears = Math.max(...W.map(w => w.years));
$('h1').textContent = `Annals of ${['One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight'][W.length - 1] || W.length} World${W.length > 1 ? 's' : ''}`;
$('lede').textContent = `${W.length} worlds started from the same rules: 36 founders, nothing told what to do. Each runs on its own, year by year, until year 2000. What you see is what emerged: who led, who rose against them, which crafts were found and lost, which winters killed.`;
$('status').textContent = `Snapshot ${new Date(DATA.made).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })} · worlds have reached year ${minYears}${minYears !== maxYears ? '–' + maxYears : ''} of 2000 and are still running`;
$('foot').innerHTML = `How it is made: each world is a headless run of the same simulation as the game (server/life), saving one line of numbers per year, every logged event and the story of everyone notable when they die. Population, technology and the annals are read straight from those files. Families from beyond the hills arrive only when a land is nearly empty. Seeds: ${W.map(w => `${esc(w.name)} ${w.seed}`).join(' · ')}.`;

function spark(w, h = 26) {
  const c = w.curve, maxP = Math.max(1, ...c.map(p => p.pop)), X = y => y / Math.max(1, w.years) * 120, Y = p => h - 2 - p / maxP * (h - 4);
  return `<svg viewBox="0 0 120 ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.4" vector-effect="non-scaling-stroke" points="${c.map(p => `${X(p.y).toFixed(1)},${Y(p.pop).toFixed(1)}`).join(' ')}"/></svg>`;
}
let cur = W[0], filter = 'all';
function pickers() {
  $('worlds').innerHTML = W.map(w => `<button type="button" id="w-${w.seed}" aria-pressed="${w === cur}" data-seed="${w.seed}">
    <span class="wname">${esc(w.name)}</span><span class="wsub">year ${w.years} · ${w.now.pop} alive</span><span style="color:var(--ochre)">${spark(w)}</span></button>`).join('');
}
$('worlds').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cur = W.find(w => w.seed === +b.dataset.seed); render(); });

const revolts = w => (w.counts.revolt || 0);
function chart(w) {
  const c = w.curve, Wd = 960, Hd = 300, L = 48, R = 46, T = 14, B = 34;
  const maxP = Math.max(5, ...c.map(p => p.pop)), maxT = Math.max(5, ...c.map(p => p.techs));
  const niceP = Math.ceil(maxP / 10) * 10, niceT = Math.ceil(maxT / 5) * 5;
  const span = Math.max(10, w.years);
  const X = y => L + y / span * (Wd - L - R), Y = p => T + (1 - p / niceP) * (Hd - T - B), YT = t => T + (1 - t / niceT) * (Hd - T - B);
  const ink = css('--ink'), soft = css('--ink-soft'), rule = css('--rule'), ochre = css('--ochre'), moss = css('--moss'), blood = css('--blood'), lapis = css('--lapis'), gold = css('--gold');
  const step = span > 1000 ? 250 : span > 400 ? 100 : span > 150 ? 50 : span > 60 ? 20 : 10;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = niceP * k / 4, y = Y(v); g += `<line x1="${L}" x2="${Wd - R}" y1="${y}" y2="${y}" stroke="${rule}" stroke-width="1"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" fill="${soft}" font-size="11" font-family="IBM Plex Mono, monospace">${Math.round(v)}</text><text x="${Wd - R + 8}" y="${YT(niceT * k / 4) + 4}" fill="${moss}" font-size="11" font-family="IBM Plex Mono, monospace">${Math.round(niceT * k / 4)}</text>`; }
  for (let y = 0; y <= span; y += step) g += `<text x="${X(y)}" y="${Hd - 12}" text-anchor="middle" fill="${soft}" font-size="11" font-family="IBM Plex Mono, monospace">${y}</text>`;
  // event ticks along the bottom: revolts, great winters, arrivals
  const marks = w.events.filter(e => e.type === 'revolt' || (e.type === 'winter' && /Great/.test(e.text)) || e.type === 'arrival' || e.type === 'war');
  for (const e of marks) {
    const col = e.type === 'winter' ? lapis : e.type === 'arrival' ? ochre : blood, x = X(e.y);
    g += `<line x1="${x}" x2="${x}" y1="${Hd - B}" y2="${Hd - B + 8}" stroke="${col}" stroke-width="2"><title>${esc(e.y + ': ' + e.text)}</title></line>`;
  }
  const area = `M${X(c[0].y)},${Y(0)} ` + c.map(p => `L${X(p.y).toFixed(1)},${Y(p.pop).toFixed(1)}`).join(' ') + ` L${X(c[c.length - 1].y)},${Y(0)} Z`;
  const tline = c.map((p, i) => `${i ? 'L' : 'M'}${X(p.y).toFixed(1)},${YT(p.techs).toFixed(1)}`).join(' ');
  const last = c[c.length - 1];
  return `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Population and known crafts of ${esc(w.name)} over ${w.years} years">
    ${g}
    <path d="${area}" fill="${ochre}" fill-opacity=".16" stroke="none"/>
    <path d="${c.map((p, i) => `${i ? 'L' : 'M'}${X(p.y).toFixed(1)},${Y(p.pop).toFixed(1)}`).join(' ')}" fill="none" stroke="${ochre}" stroke-width="2"/>
    <path d="${tline}" fill="none" stroke="${moss}" stroke-width="1.6" stroke-dasharray="5 3"/>
    <circle cx="${X(last.y)}" cy="${Y(last.pop)}" r="4" fill="${ochre}"/>
    <line x1="${L}" x2="${Wd - R}" y1="${Hd - B}" y2="${Hd - B}" stroke="${ink}" stroke-width="1"/>
  </svg>`;
}
function render() {
  pickers();
  const w = cur, n = w.now;
  const ruled = w.counts.leader || 0;
  $('world').innerHTML = `
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 18px">
      <h2>${esc(w.name)} <span class="num" style="font-size:14px;color:var(--ink-soft)">seed ${w.seed}</span></h2>
      <span class="label">year ${w.years} of 2000</span>
    </div>
    <div class="facts">
      <div class="fact"><span class="label">alive now</span><b>${fmt(n.pop)}</b></div>
      <div class="fact"><span class="label">peak</span><b>${fmt(w.peak.pop)}</b><span class="num" style="font-size:12px;color:var(--ink-soft)">year ${w.peak.y}</span></div>
      <div class="fact"><span class="label">born / died</span><b>${fmt(n.births)}</b><span class="num" style="font-size:12px;color:var(--ink-soft)">${fmt(n.deaths)} died</span></div>
      <div class="fact"><span class="label">crafts known</span><b style="color:var(--moss)">${n.techs}</b></div>
      <div class="fact"><span class="label">killings</span><b style="color:var(--blood)">${fmt(n.killings)}</b></div>
      <div class="fact"><span class="label">revolts</span><b style="color:var(--blood)">${revolts(w)}</b></div>
      <div class="fact"><span class="label">trades</span><b>${fmt(n.trades)}</b></div>
      <div class="fact"><span class="label">newcomers</span><b style="color:var(--ochre)">${w.counts.arrival || 0}</b><span class="num" style="font-size:12px;color:var(--ink-soft)">families</span></div>
    </div>
    <div class="chart">${chart(w)}
      <div class="legend"><span><i style="background:var(--ochre)"></i>people alive</span><span><i style="background:var(--moss)"></i>crafts known (right scale)</span><span><i style="background:var(--blood)"></i>revolt or war</span><span><i style="background:var(--lapis)"></i>great winter</span><span><i style="background:var(--ochre);opacity:.6"></i>newcomers arrive</span></div>
    </div>`;
  annals();
  lives();
}
const KINDS = [['all', 'everything'], ['revolt', 'revolts & wars'], ['leader', 'rulers'], ['purpose', 'vows & revenge'], ['invention', 'inventions'], ['winter', 'winters'], ['arrival', 'newcomers'], ['religion', 'faiths'], ['culture', 'writing & music']];
const match = (e, f) => f === 'all' || e.type === f || (f === 'revolt' && (e.type === 'war' || (e.type === 'killing' && /overthrown/.test(e.text)))) || (f === 'invention' && (e.type === 'discovery' || e.type === 'farming' || e.type === 'herding')) || (f === 'purpose' && e.type === 'killing' && /revenge/.test(e.text));
function annals() {
  $('chips').innerHTML = KINDS.map(([k, l]) => `<button type="button" id="f-${k}" aria-pressed="${filter === k}" data-k="${k}">${l}</button>`).join('');
  const evs = cur.events.filter(e => match(e, filter));
  if (!evs.length) { $('annals').innerHTML = '<p class="empty">Nothing of this kind has happened in this world yet.</p>'; return; }
  const by = new Map();
  for (const e of evs) { const c = Math.floor(e.y / 100); if (!by.has(c)) by.set(c, []); by.get(c).push(e); }
  $('annals').innerHTML = [...by].map(([c, list]) => `<div class="century"><h3>Years ${c * 100}–${c * 100 + 99}</h3>
    ${list.map(e => `<div class="ev k-${e.type}"><span class="y">${Math.floor(e.y)}</span><span class="t">${esc(e.text)}</span></div>`).join('')}</div>`).join('');
}
$('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.k; annals(); });
function lives() {
  const L = cur.lives.slice(0, 14);
  $('lives').innerHTML = L.length ? L.map(p => `<article class="life"><header><h3>${esc(p.name)}</h3><span class="meta">${p.born < 0 ? 'founder' : 'b. ' + p.born} – ${p.died} · ${p.age} yrs</span></header>
    <div class="tags">${[p.goal && `lived ${p.goal === 'revenge' ? 'for revenge' : 'for ' + p.goal}`, p.kills && `${p.kills} killed`, p.tribute && `took tribute ${p.tribute}×`, p.followers && `${p.followers} followers`, p.cause && `died: ${p.cause}`].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    <ol>${p.story.map(s => `<li><span>${s.y}</span><span>${esc(s.t)}</span></li>`).join('')}</ol></article>`).join('')
    : '<p class="empty">No one in this world has died with a long story yet.</p>';
}
render();
</script>
